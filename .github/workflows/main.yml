name: CI

# Workflow name based on selected inputs. Fallback to default Github naming when expression evaluates to empty string
run-name: >-
  ${{
    inputs.release && 'CI ➤ Publish to NPM' ||
    ''
  }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish new release"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # for checkout

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails if the `engines` field drifts from what the dependency graph requires
      - run: pnpm dlx ls-engines
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      # Also runs api-extractor, which fails on any export missing a release tag
      - run: pnpm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the `engines` floor; the aliases track LTS so this never goes stale
        node: [20, "lts/*", current]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # pnpm 11 needs Node >=22.13 (node:sqlite); the bundled exe keeps the Node 20 engines floor testable
        with:
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  release:
    permissions:
      contents: write # to push the version commit, tag and GitHub release
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
      id-token: write # OIDC, for npm trusted publishing and provenance
    needs: [build, test]
    # Only run if opted in during workflow_dispatch. Deliberately no `always()`
    # here — that would override `needs` and publish even when the gates fail.
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need to fetch entire commit history to
          # analyze every commit since last release
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Branches that will release new versions are defined in release.config.js,
        # which also redirects the publish itself to `pnpm publish`.
        #
        # No NPM_TOKEN: publishing uses npm trusted publishing (OIDC) via the
        # `id-token: write` permission above. A token in the environment — even
        # an empty one — can shadow OIDC, so it is deliberately absent here.
      - run: pnpm exec semantic-release
        # Don't allow interrupting the release step if the job is cancelled, as it can lead to an inconsistent state
        # e.g. git tags were pushed but it exited before `npm publish`
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
